name: compare

# 手動比對個股數值（M3 驗收、人工抽查），結果寫在 job summary
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "股票代號，以空白分隔"
        required: true
        default: "2330 2317 2454"
      date:
        description: "日期 YYYY-MM-DD（留空＝台北今天）"
        required: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare
        env:
          CODES: ${{ inputs.codes }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          read -ra args <<< "$CODES"
          [ -n "$INPUT_DATE" ] && args+=(--date "$INPUT_DATE")
          python -m screener.compare "${args[@]}" | tee compare.txt
          { echo '```'; cat compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
