name: daily-screener

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 台北 18:00
    - cron: "0 12 * * 1-5"   # 台北 20:00 補跑：18:00 已成功時會自動略過
  workflow_dispatch:
    inputs:
      date:
        description: "預期交易日 YYYY-MM-DD（留空＝台北今天；證交所資料必須是這一天）"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        id: run
        env:
          INPUT_DATE: ${{ inputs.date }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          [ -n "$INPUT_DATE" ] && args+=(--date "$INPUT_DATE")
          [ "$EVENT" = "schedule" ] && args+=(--skip-if-current)
          set +e
          python -m screener.main "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "非交易日、資料未更新或當日已完成，本次不發布"
            echo "非交易日、資料未更新或當日已完成，本次不發布" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"

      - name: Commit results
        if: steps.run.outputs.code == '0'
        run: |
          git add docs/data
          if git diff --cached --quiet; then
            echo "docs/data 沒有變動"
            exit 0
          fi
          d=$(python -c "import json; print(json.load(open('docs/data/latest.json'))['trade_date'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: $d screener results"
          git push
