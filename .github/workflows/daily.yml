name: daily-screener

# 主要觸發：外部定時服務（cron-job.org）呼叫 workflow_dispatch 並帶 scheduled=true，準時到分鐘（設定見 README）。
# 以下 GitHub 排程只是備援：GitHub 排程是盡力而為，台北傍晚（UTC 10～13 點，全球最忙）常延後數小時或被丟棄
# （2026-11-02、11-03 傍晚的排程全部沒有觸發）。因此備援時段多放在離峰，並且一律避開整點。
# 排程與 scheduled=true 都會：自動判斷日期（台北平日 17:00 後處理當天，否則前一個平日）、當日已完成則略過。
on:
  schedule:
    - cron: "17 10 * * 1-5"   # 台北 18:17
    - cron: "37 15 * * 1-5"   # 台北 23:37
    - cron: "13 18 * * 1-5"   # 台北隔天 02:13（處理前一交易日）
    - cron: "41 21 * * 1-5"   # 台北隔天 05:41（處理前一交易日）
    - cron: "23 23 * * 1-5"   # 台北隔天 07:23（處理前一交易日）
  workflow_dispatch:
    inputs:
      date:
        description: "預期交易日 YYYY-MM-DD（留空＝台北今天；證交所資料必須是這一天）"
        required: false
      scheduled:
        description: "外部排程呼叫時填 true：自動判斷日期，當日已完成則略過"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 推送前要 rebase 到最新的 main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        id: run
        env:
          INPUT_DATE: ${{ inputs.date }}
          EVENT: ${{ github.event_name }}
          SCHEDULED: ${{ inputs.scheduled }}
        run: |
          args=()
          [ -n "$INPUT_DATE" ] && args+=(--date "$INPUT_DATE")
          if [ "$EVENT" = "schedule" ] || [ "$SCHEDULED" = "true" ]; then
            args+=(--skip-if-current)
            [ -z "$INPUT_DATE" ] && args+=(--auto-date)
          fi
          echo "觸發：$EVENT，參數：${args[*]:-（無）}" >> "$GITHUB_STEP_SUMMARY"
          set +e
          python -m screener.main "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "非交易日、資料未更新或當日已完成，本次不發布"
            echo "非交易日、資料未更新或當日已完成，本次不發布" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"

      - name: Commit results
        if: steps.run.outputs.code == '0'
        run: |
          git add docs/data
          if git diff --cached --quiet; then
            echo "docs/data 沒有變動"
            exit 0
          fi
          d=$(python -c "import json; print(json.load(open('docs/data/latest.json'))['trade_date'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: $d screener results"
          # 執行期間 main 可能有新的 commit：先 rebase 再推，失敗重試，避免當天結果遺失
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            echo "推送失敗，第 $i 次重試"
            sleep $((i * 10))
          done
          echo "推送失敗，結果未寫回 repo" >> "$GITHUB_STEP_SUMMARY"
          exit 1
