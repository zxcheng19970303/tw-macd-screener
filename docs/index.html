<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MACD 三週期選股</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f0ec; --border: #e1e0d9;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #75736e;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --accent: #2a78d6; --accent-ink: #ffffff; --link: #1c5cab;
  --bar: #86b6ef; --bar-sel: #2a78d6;
  --warn-bg: #fff6e0; --warn-line: #fab219; --warn-ink: #5c4000;
  --info-bg: #eaf2fc; --info-line: #2a78d6; --info-ink: #0d366b;
  --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --border: #2c2c2a;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835;
    --accent: #3987e5; --accent-ink: #ffffff; --link: #86b6ef;
    --bar: #184f95; --bar-sel: #3987e5;
    --warn-bg: #2b2210; --warn-line: #fab219; --warn-ink: #f5d48a;
    --info-bg: #10233b; --info-line: #3987e5; --info-ink: #b7d3f6;
    --crit: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --border: #2c2c2a;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
  --grid: #2c2c2a; --axis: #383835;
  --accent: #3987e5; --accent-ink: #ffffff; --link: #86b6ef;
  --bar: #184f95; --bar-sel: #3987e5;
  --warn-bg: #2b2210; --warn-line: #fab219; --warn-ink: #f5d48a;
  --info-bg: #10233b; --info-line: #3987e5; --info-ink: #b7d3f6;
  --crit: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0; }
a { color: var(--link); }
.num { font-variant-numeric: tabular-nums; }
.meta { color: var(--ink-2); font-size: 13px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); white-space: nowrap;
}
.banner {
  margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px;
  border-left: 4px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-ink);
}
.banner.info { border-left-color: var(--info-line); background: var(--info-bg); color: var(--info-ink); }
.banner b { margin-right: 4px; }
section { margin-top: 20px; }
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .card-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.card .k { color: var(--ink-2); font-size: 13px; }
.card .v { font-size: 28px; font-weight: 650; line-height: 1.2; }
.card .s { color: var(--muted); font-size: 12px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button, .filter button {
  font: inherit; font-size: 13px; padding: 4px 10px; border: 0; background: var(--surface); color: var(--ink-2); cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.filter button { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
.filter button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { padding: 9px 10px; text-align: left; vertical-align: middle; }
th { font-size: 12px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--border); }
td { border-bottom: 1px solid var(--border); }
th.r, td.r { text-align: right; }
col.c-stock { width: 34%; }
col.c-close { width: 25%; }
col.c-vol { width: 22%; }
@media (max-width: 480px) {
  th, td { padding: 8px 6px; }
  td.num { font-size: 14px; }
}
tr.row { cursor: pointer; }
tr.row:hover td, tr.row:focus-visible td { background: var(--surface-2); }
tr.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.row[aria-expanded="true"] td { border-bottom-color: transparent; background: var(--surface-2); }
td.stock { overflow: hidden; }
.code { font-weight: 650; text-decoration: none; }
.code:hover { text-decoration: underline; }
.name { display: block; color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caret { color: var(--muted); font-size: 11px; margin-right: 4px; display: inline-block; transition: transform .15s; }
tr.row[aria-expanded="true"] .caret { transform: rotate(90deg); }
.new {
  display: inline-block; margin-left: 4px; font-size: 11px; line-height: 16px; padding: 0 5px;
  border-radius: 4px; background: var(--accent); color: var(--accent-ink); vertical-align: 1px;
}
tr.detail td { background: var(--surface-2); padding: 4px 10px 12px; }
.conds { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conds li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 8px; align-items: start; font-size: 13px; }
.conds .cl { color: var(--ink); }
.conds .cv { grid-column: 2; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.conds .k { color: var(--muted); }
.badge {
  display: inline-block; min-width: 30px; text-align: center; font-size: 11px; font-weight: 650; line-height: 18px;
  border-radius: 4px; border: 1.5px solid var(--accent); padding: 0 3px;
}
.badge.on { background: var(--accent); color: var(--accent-ink); }
.badge.off { background: transparent; color: var(--ink); border-color: var(--crit); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.empty { padding: 16px; color: var(--ink-2); font-size: 14px; }
.chart-box { position: relative; padding: 8px 8px 0; }
.chart-box svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.chart-box svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px;
  padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); display: none;
}
.day { border-top: 1px solid var(--border); padding: 12px; }
.day h3 { font-size: 14px; margin: 0 0 8px; }
.day ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.day li a {
  display: inline-block; font-size: 13px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
  text-decoration: none; color: var(--ink);
}
.day li a b { color: var(--link); margin-right: 4px; }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
footer { margin-top: 28px; color: var(--ink-2); font-size: 13px; }
footer dl { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px 8px; margin: 8px 0 12px; }
footer dd { margin: 0; }
.error { margin-top: 20px; padding: 16px; border-radius: 10px; border: 1px solid var(--crit); background: var(--surface); }
.error p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MACD 三週期共振選股</h1>
    <p class="meta num" id="meta">載入中…</p>
    <div class="chips" id="cfg"></div>
  </header>
  <div id="banners"></div>
  <main id="main" hidden>
    <section><div class="card-grid" id="cards"></div></section>

    <section>
      <div class="sec-head">
        <h2>今日入選</h2>
        <div class="seg" role="group" aria-label="排序">
          <button type="button" data-sort="code" aria-pressed="true">代號</button>
          <button type="button" data-sort="volume" aria-pressed="false">成交量</button>
          <button type="button" data-sort="streak" aria-pressed="false">連續天數</button>
        </div>
      </div>
      <div class="panel" id="hits"></div>
      <p class="hint">點選列可展開 8 個條件的數值；點代號開啟 Yahoo 股市技術分析頁。</p>
    </section>

    <section>
      <div class="sec-head"><h2>差 1 條件</h2></div>
      <div class="filter" id="near-filter" role="group" aria-label="依未通過條件篩選"></div>
      <div class="panel" id="near"></div>
    </section>

    <section>
      <div class="sec-head"><h2 id="hist-title">近 60 個交易日入選數</h2></div>
      <div class="panel">
        <div class="chart-box" id="chart"><div class="tip" id="tip"></div></div>
        <div class="day" id="day"></div>
      </div>
    </section>

    <footer>
      <strong>條件定義</strong>
      <dl id="defs"></dl>
      <div>名單依技術條件自動產生，規則尚未經過回測，僅供研究參考，不構成投資建議。</div>
    </footer>
  </main>
</div>
<script>
"use strict";
const IDS = ["M1", "W1", "W2", "D1", "D2", "D3", "D4", "V1"];
const CFG_TEXT = {
  price_source: { close: "價格：收盤價", hlcc4: "價格：hlcc4" },
  htf_bar_mode: { completed: "週月線：已完成 K 棒", current: "週月線：含未完成 K 棒" },
  d2_mode: { shrink_1d: "D2：綠柱縮 1 日", shrink_2d: "D2：綠柱連縮 2 日" },
};
const state = { latest: null, history: null, sort: "code", filter: "ALL", day: null, open: new Set() };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const quoteUrl = (code) => `https://tw.stock.yahoo.com/quote/${encodeURIComponent(code)}.TW/technical-analysis`;
const int = (n) => Math.round(n).toLocaleString("zh-TW");
const price = (n) => n.toLocaleString("zh-TW", { minimumFractionDigits: n < 1000 ? 2 : 0, maximumFractionDigits: 2 });

function fmtVal(key, v) {
  if (v === null || v === undefined) return "—";
  if (key === "volume") {
    return state.latest.config.volume_rule.startsWith("avg5_value") ? `${(v / 1e8).toFixed(2)} 億元` : `${int(v)} 張`;
  }
  return Math.abs(v) >= 100 ? v.toFixed(1) : v.toFixed(Math.abs(v) < 0.1 ? 4 : 2);
}

function taipeiToday() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());
}

// trade_date 之後到今天（含）經過的平日數；連假會多算，橫幅文字已註明
function weekdaysSince(from, to) {
  let n = 0;
  const d = new Date(from + "T00:00:00Z"), end = new Date(to + "T00:00:00Z");
  for (d.setUTCDate(d.getUTCDate() + 1); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    if (d.getUTCDay() % 6 !== 0) n++;
  }
  return n;
}

async function getJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url} 回應 HTTP ${r.status}`);
  return r.json();
}

async function load() {
  try {
    const [latest, history] = await Promise.all([getJson("data/latest.json"), getJson("data/history.json")]);
    if (!latest || !Array.isArray(latest.hits) || !history || !Array.isArray(history.days)) throw new Error("JSON 格式不符");
    state.latest = latest;
    state.history = history;
    state.day = history.days.length ? history.days[0].trade_date : null;
    render();
  } catch (e) {
    showError(e);
  }
}

function showError(e) {
  $("#meta").textContent = "資料載入失敗";
  const local = location.protocol === "file:";
  $("#banners").innerHTML = `<div class="error" role="alert"><strong>無法讀取選股資料</strong>
    <p>${esc(e.message)}</p>
    <p>${local ? "直接開啟本機檔案時瀏覽器會擋下讀取，請在專案資料夾執行 <code>python -m http.server -d docs</code> 後開啟 http://localhost:8000。" : "請稍後重新整理；若持續發生，請檢查 GitHub Actions 的執行紀錄。"}</p></div>`;
}

function render() {
  const L = state.latest;
  const gen = L.generated_at ? L.generated_at.replace("T", " ").slice(0, 16) : "—";
  $("#meta").textContent = `資料日期 ${L.trade_date} · 產生於 ${gen}`;
  const c = L.config;
  $("#cfg").innerHTML = [
    CFG_TEXT.price_source[c.price_source] || c.price_source,
    CFG_TEXT.htf_bar_mode[c.htf_bar_mode] || c.htf_bar_mode,
    `量能：${c.volume_rule}`,
    CFG_TEXT.d2_mode[c.d2_mode] || c.d2_mode,
  ].map((t) => `<span class="chip">${esc(t)}</span>`).join("");

  const banners = [];
  if (L.demo) banners.push(`<div class="banner info"><b>示範資料</b>由程式產生的模擬價格，不是真實行情。正式排程跑完後會自動取代。</div>`);
  const lag = weekdaysSince(L.trade_date, taipeiToday());
  if (!L.demo && lag > 1) banners.push(`<div class="banner"><b>⚠ 資料可能過期</b>最新資料停在 ${esc(L.trade_date)}，已超過 1 個交易日未更新（遇連假可忽略）。</div>`);
  for (const w of L.warnings || []) banners.push(`<div class="banner"><b>⚠ 提示</b>${esc(w)}</div>`);
  $("#banners").innerHTML = banners.join("");

  const s = L.stats;
  const newCount = L.hits.filter((h) => h.is_new).length;
  $("#cards").innerHTML = [
    ["入選", s.hits, `${L.trade_date.slice(5).replace("-", "/")} 符合全部 8 條件`],
    ["新進榜", newCount, "今天首次入選"],
    ["差 1 條件", s.near_miss, "提前觀察名單"],
    ["股票池", s.universe, `已評估 ${int(s.evaluated)}・資料不足 ${int(s.insufficient_data)}`],
  ].map(([k, v, sub]) => `<div class="card"><div class="k">${k}</div><div class="v num">${int(v)}</div><div class="s">${esc(sub)}</div></div>`).join("");

  $("#defs").innerHTML = IDS.map((id) => `<dt><span class="badge on">${id}</span></dt><dd>${esc(L.conditions_meta[id].label)}</dd>`).join("");
  $("#hist-title").textContent = `近 ${state.history.days.length} 個交易日入選數`;
  $("#main").hidden = false;
  renderHits();
  renderNear();
  renderChart();
  renderDay();
}

// 展開狀態以「區塊:代號」記錄，排序或篩選重繪後仍保留
function rowOpen(key) {
  const open = state.open.has(key);
  return `class="row" data-key="${esc(key)}" tabindex="0" aria-expanded="${open}"`;
}

function detailRow(item, cols, key) {
  const meta = state.latest.conditions_meta;
  const lis = IDS.map((id) => {
    const ok = item.conditions[id];
    const vals = meta[id].values.map(([label, key]) => `<span><span class="k">${esc(label)}</span> <span class="num">${fmtVal(key, item.values[key])}</span></span>`).join("");
    return `<li><span class="badge ${ok ? "on" : "off"}" title="${ok ? "通過" : "未通過"}">${id}</span><span class="cl">${esc(meta[id].label)}${ok ? "" : "（未通過）"}</span><span class="cv">${vals}</span></li>`;
  }).join("");
  return `<tr class="detail"${state.open.has(key) ? "" : " hidden"}><td colspan="${cols}"><ul class="conds">${lis}</ul></td></tr>`;
}

function stockCell(item) {
  return `<td class="stock"><span class="caret" aria-hidden="true">▶</span><a class="code" href="${quoteUrl(item.code)}" target="_blank" rel="noopener">${esc(item.code)}</a><span class="name">${esc(item.name)}</span></td>`;
}

function renderHits() {
  const hits = [...state.latest.hits];
  const by = {
    code: (a, b) => a.code.localeCompare(b.code),
    volume: (a, b) => b.volume_lots - a.volume_lots,
    streak: (a, b) => b.streak - a.streak || a.code.localeCompare(b.code),
  };
  hits.sort(by[state.sort]);
  document.querySelectorAll("[data-sort]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sort === state.sort)));
  if (!hits.length) {
    $("#hits").innerHTML = `<div class="empty">今天沒有符合全部條件的股票。</div>`;
    return;
  }
  const rows = hits.map((h) => `<tr ${rowOpen("h:" + h.code)}>${stockCell(h)}
    <td class="r num">${price(h.close)}</td><td class="r num">${int(h.volume_lots)}</td>
    <td class="r num">${h.is_new ? '<span class="new">新</span> ' : ""}${h.streak}</td></tr>${detailRow(h, 4, "h:" + h.code)}`).join("");
  $("#hits").innerHTML = `<table><colgroup><col class="c-stock"><col class="c-close"><col class="c-vol"><col></colgroup>
    <thead><tr><th>股票</th><th class="r">收盤</th><th class="r">量（張）</th><th class="r">連續日</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderNear() {
  const all = state.latest.near_miss;
  const counts = {};
  for (const n of all) for (const id of n.failed) counts[id] = (counts[id] || 0) + 1;
  if (state.filter !== "ALL" && !counts[state.filter]) state.filter = "ALL";
  const opts = [["ALL", `全部 ${all.length}`], ...IDS.filter((id) => counts[id]).map((id) => [id, `${id} ${counts[id]}`])];
  $("#near-filter").innerHTML = opts.map(([id, t]) => `<button type="button" data-filter="${id}" aria-pressed="${id === state.filter}">${esc(t)}</button>`).join("");
  const list = all.filter((n) => state.filter === "ALL" || n.failed.includes(state.filter));
  if (!list.length) {
    $("#near").innerHTML = `<div class="empty">沒有只差 1 個條件的股票。</div>`;
    return;
  }
  const rows = list.map((n) => `<tr ${rowOpen("n:" + n.code)}>${stockCell(n)}
    <td class="r num">${price(n.close)}</td><td class="r num">${int(n.volume_lots)}</td>
    <td><span class="badges">${n.failed.map((id) => `<span class="badge off" title="未通過">${id}</span>`).join("")}</span></td></tr>${detailRow(n, 4, "n:" + n.code)}`).join("");
  $("#near").innerHTML = `<table><colgroup><col class="c-stock"><col class="c-close"><col class="c-vol"><col></colgroup>
    <thead><tr><th>股票</th><th class="r">收盤</th><th class="r">量（張）</th><th>未通過</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function niceStep(max) {
  const raw = Math.max(max / 4, 1);
  const p = 10 ** Math.floor(Math.log10(raw));
  const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function chartDays() {
  return [...state.history.days].sort((a, b) => a.trade_date.localeCompare(b.trade_date));
}

function renderChart() {
  const box = $("#chart");
  box.querySelector("svg")?.remove();
  const days = chartDays();
  if (!days.length) return;
  const W = Math.max(box.clientWidth - 16, 240), H = 180;
  const m = { t: 20, r: 6, b: 24, l: 30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const step = niceStep(Math.max(...days.map((d) => d.count), 1));
  const top = Math.max(step, Math.ceil(Math.max(...days.map((d) => d.count)) / step) * step);
  const y = (v) => m.t + ih - (v / top) * ih;
  const slot = iw / days.length;
  const bw = Math.max(1, Math.min(24, slot - 2));
  const parts = [];
  for (let v = 0; v <= top; v += step) {
    parts.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(${v ? "--grid" : "--axis"})" stroke-width="1" shape-rendering="crispEdges"/>`);
    parts.push(`<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`);
  }
  days.forEach((d, i) => {
    const x = m.l + i * slot + (slot - bw) / 2;
    const sel = d.trade_date === state.day;
    if (d.count) parts.push(`<path d="${barPath(x, y(d.count), bw, y(0) - y(d.count), 4)}" fill="var(${sel ? "--bar-sel" : "--bar"})"/>`);
    if (sel) parts.push(`<text x="${x + bw / 2}" y="${y(d.count) - 5}" text-anchor="middle" font-size="11" font-weight="650" fill="var(--ink)">${d.count}</text>`);
  });
  const lab = (i, anchor) => `<text x="${m.l + i * slot + slot / 2}" y="${H - 6}" text-anchor="${anchor}" font-size="11" fill="var(--muted)">${days[i].trade_date.slice(5).replace("-", "/")}</text>`;
  parts.push(lab(0, "start"));
  if (days.length > 1) parts.push(lab(days.length - 1, "end"));
  days.forEach((d, i) => parts.push(`<rect data-i="${i}" x="${m.l + i * slot}" y="${m.t}" width="${slot}" height="${ih}" fill="transparent"/>`));
  box.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img"
    aria-label="近 ${days.length} 個交易日每日入選數長條圖，可用左右鍵切換日期">${parts.join("")}</svg>`);
  const svg = box.querySelector("svg");
  const tip = $("#tip");
  svg.addEventListener("pointermove", (e) => {
    const i = e.target.dataset?.i;
    if (i === undefined) { tip.style.display = "none"; return; }
    const d = days[i];
    const scale = svg.getBoundingClientRect().width / W;
    tip.textContent = `${d.trade_date}・入選 ${d.count} 檔`;
    tip.style.left = `${8 + (m.l + i * slot + slot / 2) * scale}px`;
    tip.style.top = `${8 + (y(d.count) - 8) * scale}px`;
    tip.style.display = "block";
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  svg.addEventListener("click", (e) => {
    const i = e.target.dataset?.i;
    if (i !== undefined) selectDay(days[i].trade_date);
  });
  svg.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const i = days.findIndex((d) => d.trade_date === state.day);
    const j = Math.min(days.length - 1, Math.max(0, i + (e.key === "ArrowRight" ? 1 : -1)));
    selectDay(days[j].trade_date);
    $("#chart svg").focus();
  });
}

function selectDay(d) {
  state.day = d;
  renderChart();
  renderDay();
}

function renderDay() {
  const day = state.history.days.find((d) => d.trade_date === state.day);
  if (!day) { $("#day").innerHTML = `<div class="hint">尚無歷史紀錄。</div>`; return; }
  const names = state.history.names || {};
  const items = day.hits.map((c) => `<li><a href="${quoteUrl(c)}" target="_blank" rel="noopener"><b>${esc(c)}</b>${esc(names[c] || "")}</a></li>`).join("");
  $("#day").innerHTML = `<h3 class="num">${esc(day.trade_date)}・入選 ${day.count} 檔</h3>${day.count ? `<ul>${items}</ul>` : `<div class="hint">當日沒有入選股票。</div>`}
    <p class="hint">點選長條可切換日期。</p>`;
}

function toggleRow(tr) {
  const open = tr.getAttribute("aria-expanded") !== "true";
  tr.setAttribute("aria-expanded", String(open));
  tr.nextElementSibling.hidden = !open;
  if (open) state.open.add(tr.dataset.key);
  else state.open.delete(tr.dataset.key);
}

for (const id of ["#hits", "#near"]) {
  const el = $(id);
  el.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const tr = e.target.closest("tr.row");
    if (tr) toggleRow(tr);
  });
  el.addEventListener("keydown", (e) => {
    const tr = e.target.closest("tr.row");
    if (tr && e.target === tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleRow(tr); }
  });
}
document.querySelector(".seg").addEventListener("click", (e) => {
  const b = e.target.closest("[data-sort]");
  if (b) { state.sort = b.dataset.sort; renderHits(); }
});
$("#near-filter").addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]");
  if (b) { state.filter = b.dataset.filter; renderNear(); }
});
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => state.history && renderChart(), 150);
});
load();
</script>
</body>
</html>
