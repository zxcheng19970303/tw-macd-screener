# 猶太操盤術 MACD 選股系統設定檔
# 規則參數與開關只放這裡；條件邏輯只寫在 screener/rules.py。

markets: [TWSE, TPEX]      # 上市＋上櫃

# 兩組週期：同一套條件，M1＝上級、W1／W2＝本級、D1～D4＝下級；V1 一律看當日成交量
# 週期代號：60m＝60 分、D＝日、W＝週、M＝月
groups:
  - {id: g1, name: 第 1 組, lower: 60m, middle: D, upper: W}
  - {id: g2, name: 第 2 組, lower: D, middle: W, upper: M}

# 觀察清單：獨立於下面 8 個條件，股票池（上市＋上櫃）每一檔都判斷，不設量能門檻
# A1：日線 MACD > 0（不看 DIF）；A2：剛站上 N 日線（昨收 ≤ N 日均線，今收 > N 日均線）
watchlist: {id: watch, name: 觀察清單, macd_set: ro, ma_days: 10, min_bars: 60}

# MACD 參數（快線 / 慢線 / 訊號線）
macd:
  bo: {fast: 6, slow: 12, signal: 3}     # 波：只計算顯示，不用於條件
  ro: {fast: 10, slow: 20, signal: 10}   # 羅：上級、本級、下級週期都用（M1、W1、W2、D1、D2）
  mi: {fast: 26, slow: 52, signal: 13}   # 蜜：只用在下級週期確認（D3、D4）

# v1 未使用，保留設定
ma: [3, 10, 30, 100, 300, 900]
wrsi: [3, 6]

# 規則開關（規格書第 2 節）
switches:
  price_source: close      # close：收盤價｜hlcc4：(高+低+2×收)/4
  htf_bar_mode: completed  # completed：只用已收完的週月 K｜current：含未完成 K 棒
  volume_rule: day_lots    # day_lots：當日張數｜avg5_lots：5 日均張｜avg5_value：5 日均成交金額
  d2_mode: shrink_1d       # shrink_1d：綠柱比前一日短｜shrink_2d：連續 2 日縮短

thresholds:
  volume_lots: 300          # day_lots、avg5_lots 門檻（張）
  avg5_value: 50000000      # avg5_value 門檻（元）

universe:
  code_pattern: '^[1-9]\d{3}$'     # 4 位數且非 0 開頭
  exclude_name_patterns: ['-DR$']  # 排除 4 位數代號的存託憑證（如 9105 泰金寶-DR）
  min_upper_bars: 60               # 上級週期至少 60 根已完成 K 棒（第 1 組＝60 週、第 2 組＝60 個月）

exchange:                   # 證交所 MI_INDEX、櫃買中心每日收盤行情
  timeout_sec: 30
  retries: 3
  retry_wait_sec: 30

prices:
  years: 8
  batch_size: 100
  retries: 3
  retry_wait_sec: 10
  max_fail_ratio: 0.2       # 日線抓價失敗超過此比例即中止；60 分 K 超過此比例則該組當日不更新
  intraday_days: 180        # 60 分 K 抓近 180 天（Yahoo 上限約 730 天）
  intraday_retries: 1

report:
  history_days: 60
  hits_warn_ratio: 0.3      # 入選數超過股票池此比例時加上警示
